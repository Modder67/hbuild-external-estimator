# HBUILD external estimator on Netlify: Vite SPA + the Express API as one function.
# Build-time env the config requires: PORT=5173 (unused at build), BASE_PATH=/,
# VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY. Server env: see DEPLOY-NETLIFY.md.
[build]
  command = "pnpm run typecheck && pnpm --filter @workspace/deck-estimate run build && node netlify/db-push.mjs"
  publish = "artifacts/deck-estimate/dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The SPA calls same-origin /api/*; hand those to the Express function with the
# original path intact. Everything else falls back to the SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
