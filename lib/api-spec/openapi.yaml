openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mesh
    description: Authorized HBUILD mesh reads
paths:
  /mesh/status:
    get:
      operationId: getMeshStatus
      tags: [mesh]
      summary: Check whether server-side mesh access is configured
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured]
                properties:
                  configured: { type: boolean }
  /mesh/projects:
    get:
      operationId: listMeshProjects
      tags: [mesh]
      summary: List canonical planner projects through the mesh gateway
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeshProject"
        "401":
          description: Missing or invalid user session
        "403":
          description: Membership or app grant denied
        "503":
          description: Mesh not configured or unavailable
  /mesh/projects/{id}/details:
    get:
      operationId: getMeshProjectDetails
      tags: [mesh]
      summary: Read H Draft job details after verifying canonical project access
      security:
        - userAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verified H Draft project linkage and available client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshProjectDetails"
        "400":
          description: Invalid project identifier
        "401":
          description: Missing or invalid user session
        "403":
          description: User or app grant denied
        "404":
          description: Project not available or not linked in H Draft
        "503":
          description: Source not provisioned or temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    userAccessToken:
      type: http
      scheme: bearer
  schemas:
    MeshProject:
      type: object
      additionalProperties: false
      required: [id, name, slug, color, sort]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        color: { type: string }
        sort: { type: integer }
    MeshProjectDetails:
      type: object
      additionalProperties: false
      required: [projectId, jobCode, customerName, customerAddress, clientSource]
      properties:
        projectId: { type: string, format: uuid }
        jobCode: { type: [string, "null"] }
        customerName: { type: [string, "null"] }
        customerAddress: { type: [string, "null"] }
        clientSource: { type: string, enum: [ledger, draft-link, missing] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

